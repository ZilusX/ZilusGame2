<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ZilusGame</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d1b2a;overflow:hidden;font-family:Arial,sans-serif;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #menu{position:fixed;inset:0;background:#0d1b2a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
  #menu h1{font-size:clamp(34px,10vw,64px);margin:0;color:#4cc9f0}
  #menu button{padding:14px 40px;font-size:20px;border:0;border-radius:10px;background:#4cc9f0;color:#0d1b2a;font-weight:bold}
  #score{position:fixed;top:10px;right:14px;color:#fff;font-size:20px;display:none}

  #hack{display:none;position:fixed;inset:0;background:#000;color:#00ff66;font-family:"Courier New",monospace;padding:16px;flex-direction:column;z-index:10}
  #warn{color:#ff2b2b;font-size:clamp(20px,5vw,34px);font-weight:bold;text-align:center;animation:blink 1s infinite}
  #timer{color:#ff2b2b;font-size:clamp(40px,12vw,90px);text-align:center;margin:6px 0}
  #bar{height:10px;background:#220;border:1px solid #ff2b2b;margin-bottom:10px}
  #fill{height:100%;width:0;background:#ff2b2b}
  #log{flex:1;overflow:hidden;font-size:clamp(11px,2.8vw,15px);line-height:1.6;direction:ltr;text-align:left}
  #reveal{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#111;text-align:center;padding:20px;overflow:auto;user-select:text;touch-action:auto;z-index:20}
  #reveal h1{font-size:clamp(28px,8vw,56px);margin:0 0 8px}
  #info{background:#f1f3f4;border-radius:10px;padding:14px;margin-top:16px;text-align:left;direction:ltr;font-size:14px;line-height:1.8;max-width:520px;width:100%}
  #info b{color:#1a73e8}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="score">🪙 0</div>

<div id="menu">
  <h1>ZilusGame</h1>
  <p>حرّك الشخصية بإصبعك، اجمع العملات<br>ووصّل للبوابة 🌀 عشان تكسب!</p>
  <button id="play">ابدأ اللعب</button>
</div>

<div id="hack">
  <div id="warn">⚠ تم اختراق جهازك ⚠</div>
  <div id="timer">100</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="log"></div>
</div>

<div id="reveal">
  <h1>😂 مقلب!</h1>
  <p style="font-size:18px">جهازك سليم ١٠٠٪ ومحدش اخترقك. دي لعبة مقلب بس.</p>
  <p style="color:#666">دي المعلومات اللي أي موقع تدخله يقدر يشوفها عنك بسهولة:</p>
  <div id="info"></div>
</div>

<script>
const TOTAL = 100;
let armed = false, playing = false, triggered = false;

// ===== اللعبة =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

const player = { x: W * 0.15, y: H * 0.85, r: 22, speed: 4.5 };
let target = null, score = 0;
const keys = {};

// العملات (مواقع نسبية عشان تناسب أي شاشة)
const coins = [
  [0.25,0.7],[0.5,0.75],[0.75,0.65],[0.3,0.5],[0.6,0.45],[0.8,0.35],[0.45,0.28],[0.2,0.25]
].map(p => ({ rx:p[0], ry:p[1], got:false }));

// البوابة (المكان المعين)
const portal = { rx: 0.85, ry: 0.12, r: 34 };

addEventListener('pointerdown', e => { if (playing) target = { x:e.clientX, y:e.clientY }; });
addEventListener('pointermove', e => { if (playing && e.buttons) target = { x:e.clientX, y:e.clientY }; });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

function update(){
  let dx = 0, dy = 0;
  if (keys['arrowleft']  || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup']    || keys['w']) dy -= 1;
  if (keys['arrowdown']  || keys['s']) dy += 1;
  if (dx || dy){ target = null; const l = Math.hypot(dx,dy); player.x += dx/l*player.speed; player.y += dy/l*player.speed; }
  else if (target){
    const vx = target.x - player.x, vy = target.y - player.y, d = Math.hypot(vx,vy);
    if (d > player.speed){ player.x += vx/d*player.speed; player.y += vy/d*player.speed; } else target = null;
  }
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  coins.forEach(c => {
    if (!c.got && Math.hypot(player.x - c.rx*W, player.y - c.ry*H) < player.r + 14){
      c.got = true; score++; document.getElementById('score').textContent = '🪙 ' + score;
    }
  });

  if (!triggered && Math.hypot(player.x - portal.rx*W, player.y - portal.ry*H) < player.r + portal.r - 8){
    triggered = true; playing = false; startHack();
  }
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  // شبكة خلفية
  ctx.strokeStyle = 'rgba(76,201,240,.08)'; ctx.lineWidth = 1;
  for (let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  coins.forEach(c => { if (!c.got){ ctx.font = '28px serif'; ctx.fillText('🪙', c.rx*W, c.ry*H); } });

  // البوابة بتنبض
  const pulse = 1 + Math.sin(t/300) * 0.12;
  ctx.font = (portal.r*2*pulse) + 'px serif';
  ctx.fillText('🌀', portal.rx*W, portal.ry*H);
  ctx.font = '14px Arial'; ctx.fillStyle = '#4cc9f0';
  ctx.fillText('الهدف', portal.rx*W, portal.ry*H + portal.r + 14);

  ctx.font = (player.r*2) + 'px serif'; ctx.fillStyle = '#fff';
  ctx.fillText('🚀', player.x, player.y);
}

function loop(t){
  if (playing){ update(); draw(t); requestAnimationFrame(loop); }
}

document.getElementById('play').onclick = async () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('score').style.display = 'block';
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  armed = true; playing = true;
  requestAnimationFrame(loop);
};

// ===== منع الخروج وقت المقلب فقط =====
let hacking = false;
addEventListener('beforeunload', e => { if (hacking){ e.preventDefault(); e.returnValue = ''; } });
addEventListener('contextmenu', e => { if (hacking) e.preventDefault(); });
addEventListener('keydown', e => {
  if (hacking && (e.key === 'F5' || e.key === 'F12' || (e.ctrlKey && 'wrsuw'.includes(e.key.toLowerCase())))) e.preventDefault();
});
history.pushState(null, '', location.href);
addEventListener('popstate', () => { if (hacking) history.pushState(null, '', location.href); });

// ===== المقلب =====
const fakeLines = [
  'Connecting to remote server 185.220.xxx.xxx ...',
  'Bypassing firewall ........ OK',
  'Injecting payload into system32 ........ OK',
  'Accessing camera ........ GRANTED',
  'Reading saved passwords ........ 47 found',
  'Copying gallery ........ 12%',
  'Accessing contacts ........ DONE',
  'Disabling antivirus ........ OK',
  'Uploading files to server ........ 38%',
  'Locking browser controls ........ OK',
  'Encrypting documents ........ 61%',
  'Reading messages ........ DONE',
  'Escalating privileges ........ ROOT',
  'Uploading files to server ........ 89%'
];

function startHack(){
  hacking = true;
  document.getElementById('score').style.display = 'none';
  const h = document.getElementById('hack'); h.style.display = 'flex';
  const timer = document.getElementById('timer');
  const fill = document.getElementById('fill');
  const log = document.getElementById('log');
  let left = TOTAL;

  const logTimer = setInterval(() => {
    log.innerHTML += '> ' + fakeLines[Math.floor(Math.random()*fakeLines.length)] + '<br>';
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 60) log.innerHTML = '';
  }, 450);

  const t = setInterval(() => {
    left--;
    timer.textContent = left;
    fill.style.width = ((TOTAL-left)/TOTAL*100) + '%';
    if (left <= 0){ clearInterval(t); clearInterval(logTimer); finish(); }
  }, 1000);
}

async function finish(){
  hacking = false;
  if (document.fullscreenElement){ try { await document.exitFullscreen(); } catch(e){} }
  document.getElementById('hack').style.display = 'none';
  document.getElementById('reveal').style.display = 'flex';

  const n = navigator;
  const rows = [
    ['Browser', n.userAgent],
    ['Platform', n.userAgentData?.platform || n.platform],
    ['Language', n.language],
    ['Timezone', Intl.DateTimeFormat().resolvedOptions().timeZone],
    ['Screen', screen.width + ' x ' + screen.height + ' @' + devicePixelRatio + 'x'],
    ['CPU cores', n.hardwareConcurrency || 'unknown'],
    ['RAM (approx)', n.deviceMemory ? n.deviceMemory + ' GB' : 'unknown'],
    ['Touch screen', ('ontouchstart' in window) ? 'yes' : 'no'],
    ['Network', n.connection ? (n.connection.effectiveType + ' / ' + n.connection.downlink + ' Mbps') : 'unknown'],
    ['Online', n.onLine ? 'yes' : 'no'],
    ['Local time', new Date().toString()]
  ];
  try {
    if (n.getBattery){
      const b = await n.getBattery();
      rows.push(['Battery', Math.round(b.level*100) + '%' + (b.charging ? ' (charging)' : '')]);
    }
  } catch(e){}

  document.getElementById('info').innerHTML =
    rows.map(r => '<b>' + r[0] + ':</b> ' + String(r[1]).replace(/</g,'&lt;')).join('<br>');
}
</script>
</body>
</html>
